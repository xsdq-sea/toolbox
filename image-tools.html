<div id="app" data-server-rendered="true"><div class="wrap"><header><a class="brand" href="./index.html">Toolbox · 工具箱</a><a href="./index.html">← 所有工具</a></header><main><p class="eyebrow">图片处理</p><h1>图片处理</h1><p class="intro">压缩、转换格式、裁剪缩放、图片转 Base64、取色与文字水印。</p><nav class="operations" aria-label="选择功能"><!--[--><button class="operation" type="button" data-operation="image-compress" aria-pressed="true">批量压缩</button><button class="operation" type="button" data-operation="image-convert" aria-pressed="false">格式转换</button><button class="operation" type="button" data-operation="image-resize" aria-pressed="false">裁剪与缩放</button><button class="operation" type="button" data-operation="image-base64" aria-pressed="false">图片转 Base64</button><button class="operation" type="button" data-operation="color-picker" aria-pressed="false">取色器</button><button class="operation" type="button" data-operation="image-watermark" aria-pressed="false">添加水印</button><!--]--></nav><noscript><p>请启用 JavaScript 使用此工具；所有计算均在当前浏览器完成。</p></noscript><section class="panel"><h2 id="subtool-title">批量压缩</h2><form id="tool-form"><div id="fields" class="fields" data-allow-mismatch="children"><label class="field">选择图片（支持多选）<input id="file" type="file" value="" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" multiple=""></label><label class="field">输出格式<select id="type"><option value="image/jpeg">JPEG（不保留透明）</option><option value="image/webp" selected="">WebP</option></select></label><label class="field">压缩质量（0.1～1）<input id="quality" type="number" value=".8" min="0.1" max="1" step="0.05"></label><label class="field">最大宽度（0 保留原尺寸）<input id="width" type="number" value="1920" min="0" max="10000"></label><p class="hint wide">每批最多 20 张、总计 100 MB。透明图片导出 JPEG 时使用白色背景；动图只处理第一帧。</p></div><div class="actions"><button id="run" class="primary" type="submit">压缩图片</button></div></form><p id="status" class="status" role="status" aria-live="polite"></p></section><section id="preview" class="panel preview" aria-label="结果预览" hidden=""></section><section id="result-panel" class="panel" hidden=""><h2>处理结果</h2><textarea id="result" aria-label="处理结果" rows="10" readonly="" spellcheck="false"></textarea><div class="actions"><button id="copy" type="button">复制结果</button><button id="download" type="button">下载结果</button></div></section></main><footer>Toolbox · 内容仅在本地处理，不上传、不保存。<a href="./index.html">返回首页</a></footer></div></div>
