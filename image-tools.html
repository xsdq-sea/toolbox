d">选择图片（支持多选）<input id="file" type="file" value="" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" multiple=""></label><label class="field">输出格式<select id="type"><option value="image/jpeg">JPEG（不保留透明）</option><option value="image/webp" selected="">WebP</option></select></label><label class="field">压缩质量（0.1～1）<input id="quality" type="number" value=".8" min="0.1" max="1" step="0.05"></label><label class="field">最大宽度（0 保留原尺寸）<input id="width" type="number" value="1920" min="0" max="10000"></label><p class="hint wide">每批最多 20 张、总计 100 MB。透明图片导出 JPEG 时使用白色背景；动图只处理第一帧。</p></div><div class="actions"><button id="run" class="primary" type="submit">压缩图片</button></div></form><p id="status" class="status" role="status" aria-live="polite"></p></section><section id="preview" class="panel preview" aria-label="结果预览" hidden=""></section><section id="result-panel" class="panel" hidden=""><h2 class="result-title">处理结果<span id="result-swatch" class="result-swatch color-checker" role="img" aria-label="所选颜色" hidden=""><span></span></span></h2><div id="result-values" hidden=""></div><textarea id="result" aria-label="处理结果" rows="10" readonly="" spellcheck="false"></textarea><div class="actions"><button id="copy" type="button">复制结果</button><button id="download" type="button">下载结果</button></div></section></div><!--]--></main><footer class="site-footer" data-v-96eceecf=""><span data-v-96eceecf="">Toolbox · 内容仅在本地处理，不上传、不保存。</span><a href="./index.html" data-v-96eceecf="">返回首页</a></footer></div><button class="back-to-top" type="button" hidden="" aria-label="回到顶部" title="回到顶部" data-v-c0ae09be=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-v-c0ae09be=""><path d="M12 20V8m-6 6 6-6 6 6M5 4h14" data-v-c0ae09be=""></path></svg></button><!--]--></div>
