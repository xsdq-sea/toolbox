<div id="app" data-server-rendered="true"><!--[--><!--[--><div class="wrap"><header class="site-header" data-v-34ccbdb1=""><div class="header-brand" data-v-34ccbdb1=""><!--[--><a class="brand" href="./index.html" data-v-34ccbdb1="">Toolbox · 工具箱</a><!--]--></div><div class="header-actions" data-v-34ccbdb1=""><div class="theme-settings" hidden="" data-v-34ccbdb1="" data-v-601a946b=""><button class="theme-toggle" type="button" aria-label="当前外观：跟随系统，点击切换为亮白" title="切换主题" data-v-601a946b=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-v-601a946b=""><!--[--><rect x="3" y="4" width="18" height="13" rx="2" data-v-601a946b=""></rect><path d="M8 21h8m-4-4v4" data-v-601a946b=""></path><!--]--></svg></button><span class="theme-notice" role="status" aria-live="polite" data-v-601a946b=""></span></div></div></header><main><p class="eyebrow">图片处理</p><h1>图片拼接与切分</h1><p class="intro">把多张图片拼成一张，或将长截图、图片按高度和宫格拆分。支持预览、单张下载与 ZIP 打包。</p><!--[--><noscript><p>请启用 JavaScript 使用此工具；所有处理均在当前浏览器完成。</p></noscript><section class="panel"><nav class="tabs" aria-label="选择图片功能"><button id="merge-tab" type="button" aria-pressed="true">图片拼接</button><button id="split-tab" type="button" aria-pressed="false">图片切分</button></nav><form id="image-form"><div id="merge-fields"><label class="field">选择需要拼接的图片<input id="merge-files" type="file" accept="image/png,image/jpeg,image/webp" multiple=""><span class="hint">支持 PNG、JPEG、WebP，最多 20 张；单张不超过 20 MB，合计不超过 100 MB。可多次选择追加图片，按下方顺序拼接，可上下调整。</span></label><ol id="file-list" class="file-list"></ol><div class="fields"><label class="field">拼接方向<select id="direction"><option value="vertical">纵向拼接</option><option value="horizontal">横向拼接</option></select></label><label class="field"><span id="size-label">统一宽度（像素）</span><input id="size" type="number" min="1" max="16000" step="1" value="1000" required=""><span class="hint">按比例缩放，可放大；纵向统一宽度，横向统一高度。</span></label><label class="field">图片间距（像素）<input id="gap" type="number" min="0" max="200" step="1" value="0" required=""></label></div></div><div id="split-fields" hidden=""><label class="field">选择需要切分的图片<input id="split-file" type="file" accept="image/png,image/jpeg,image/webp" disabled=""><span class="hint">支持 PNG、JPEG、WebP，单张不超过 20 MB。原图不缩放、不丢失边缘像素。</span></label><div class="fields" style="margin-top:18px;"><label class="field">切分方式<select id="split-mode" disabled=""><option value="height">按固定高度切长图</option><option value="grid">按行列切宫格</option></select></label><label id="height-field" class="field">每段高度（像素）<input id="slice-height" type="number" min="1" max="16000" step="1" value="1000" required="" disabled=""></label><label id="rows-field" class="field" hidden="">行数<input id="rows" type="number" min="1" max="100" step="1" value="3" required="" disabled=""></label><label id="cols-field" class="field" hidden="">列数<input id="cols" type="number" min="1" max="100" step="1" value="3" required="" disabled=""></label></div></div><div class="fields" style="margin-top:18px;"><label class="field">输出格式<select id="format"><option value="image/png">PNG · 保留透明区域</option><option value="image/jpeg">JPEG · 白底或指定底色</option></select></label><label class="field"><span id="background-label">间距／JPEG 背景色</span><input id="background" type="color" value="#ffffff"><span id="background-hint" class="hint">拼接间距使用此颜色；导出 JPEG 时也用于填充透明区域，PNG 保留透明区域。</span></label></div><div class="actions"><button id="run-image" class="primary" type="submit">生成拼接图</button></div></form><p id="status" class="status" role="status" aria-live="polite"></p></section><section id="results" class="panel" hidden=""><h2>处理结果</h2><p id="output-summary" class="hint"></p><div class="actions"><button id="zip-download" type="button" hidden="">打包下载全部图片</button></div><div id="image-results" class="image-grid" style="margin-top:20px;"></div></section><section class="panel"><h2>处理说明</h2><p class="hint">仅处理当前选择的文件，不上传、不修改原图。输入和输出单边最多 16,000 像素、单张最多 3,200 万像素；切分最多 100 张。宫格不能整除时将余下像素分配到相邻格子；长图最后一段保留实际高度。静态图片以浏览器解码结果为准，不保留 EXIF 等元数据。</p></section><!--]--></main><footer class="site-footer" data-v-96eceecf=""><span data-v-96eceecf="">Toolbox · 内容仅在本地处理，不上传、不保存。</span><a href="./index.html" data-v-96eceecf="">返回首页</a></footer></div><dialog id="image-preview" class="image-preview" aria-labelledby="preview-title"><div class="preview-toolbar"><div class="preview-heading"><h2 id="preview-title">图片预览</h2><p id="preview-caption" class="hint"></p></div><a id="preview-download" class="button">下载图片</a><button id="preview-size" type="button" aria-pressed="false">原始尺寸</button><button id="preview-close" type="button" autofocus="">关闭预览</button></div><div id="preview-stage" class="preview-stage" tabindex="0" role="region" aria-label="图片预览区域，可滚动查看原始尺寸"><img id="preview-image" alt=""></div></dialog><!--]--><button class="back-to-top" type="button" hidden="" aria-label="回到顶部" title="回到顶部" data-v-c0ae09be=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-v-c0ae09be=""><path d="M12 20V8m-6 6 6-6 6 6M5 4h14" data-v-c0ae09be=""></path></svg></button><!--]--></div>
